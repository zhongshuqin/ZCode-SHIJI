# 推送 v* tag 自动打包三平台桌面安装包并发布到 GitHub Release。
# 也可在 Actions 页面手动触发 workflow_dispatch 验证构建（不发布 Release）。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # CI 不需要 git hooks。
  HUSKY: "0"
  # 桌面安装包不依赖 mock-cdn remote 资产；打包脚本提供的官方 CI 开关，跳过后可显著缩短构建时间。
  ZCODE_SKIP_REMOTE_ASSETS: "1"
  # 生产身份：不设时默认按 test 处理，会打出 _TEST 后缀的 Preview 包。
  ZCODE_ENV: "production"
  # GitHub runner 直连官方源，跳过脚本默认的 npmmirror 国内镜像。
  ELECTRON_MIRROR: "https://github.com/electron/electron/releases/download/"
  ELECTRON_BUILDER_BINARIES_MIRROR: "https://github.com/electron-userland/electron-builder-binaries/releases/download/"

jobs:
  build-desktop:
    name: 桌面版 ${{ matrix.target-os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-os: mac
            arch: arm64
            runs-on: macos-15
            electron-cache: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
          - target-os: win
            arch: x64
            runs-on: windows-latest
            electron-cache: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
          - target-os: linux
            arch: x64
            runs-on: ubuntu-latest
            electron-cache: |
              ~/.cache/electron
              ~/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安装包版本取根 package.json；tag 触发时把 v 前缀去掉同步进去，让产物版本与 Release 一致。
      - name: Sync package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('[release] package version -> ' + process.argv[1]);
          " "$version"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      # rpm 目标要求构建机提供 rpmbuild（仓库 electron-builder.config.js 注释）。
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ${{ matrix.electron-cache }}
          key: electron-${{ runner.os }}-${{ matrix.target-os }}-${{ matrix.arch }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 入口统一走仓库自带 bundle 脚本：内部完成 runtime assets 准备、构建、
      # electron-builder 打包与 app.asar 依赖闭包机械校验。
      - name: Bundle desktop package
        run: pnpm bundle:desktop -- --os ${{ matrix.target-os }} --arch ${{ matrix.arch }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target-os }}-${{ matrix.arch }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
